<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #333333;
      margin-bottom: 20px;
    }

    form {
      margin: 20px 0;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: #555555;
    }

    input {
      padding: 10px;
      font-size: 16px;
      width: 200px;
      border: 1px solid #dddddd;
      border-radius: 4px;
      margin-right: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #weather,
    #temperature,
    #location,
    #timezone {
      margin-top: 20px;
      font-size: 18px;
      color: #333333;
    }

    #map {
      margin-top: 20px;
      height: 300px; /* Adjust the height based on your preference */
      border-radius: 8px;
      overflow: hidden;
    }
  </style>
  <title>Weather App</title>
</head>
<body>
  <div class="container">
    <h1>Weather App</h1>
    <form id="cityForm">
      <label for="cityInput">Enter City:</label>
      <input type="text" id="cityInput" required>
      <button type="submit">Get Weather</button>
    </form>
    <div id="weather"></div>
    <div id="temperature"></div>
    <div id="location"></div>
    <div id="timezone"></div>
    <div id="map"></div>
  </div>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDFj3ayoSC7Jr07cyjAsWjIHepaz5mQ_ps&libraries=places"></script>
  <script src="js/core.js"></script>
</body>
</html>
